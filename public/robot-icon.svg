<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#1e293b" stroke-width="8" />

  <!-- LEGO Brick Studs Top -->
  <circle cx="176" cy="74" r="32" fill="url(#amber-grad)" opacity="0.9" />
  <circle cx="336" cy="74" r="32" fill="url(#amber-grad)" opacity="0.9" />

  <!-- Robot Head Frame -->
  <rect x="76" y="116" width="360" height="300" rx="48" fill="#0f172a" stroke="#334155" stroke-width="10" />

  <!-- Screen Visor Glass -->
  <rect x="108" y="148" width="296" height="200" rx="32" fill="#030712" stroke="#0ea5e9" stroke-width="4" />

  <!-- Expressive Robot Eyes -->
  <!-- Left Eye -->
  <g filter="url(#glow)">
    <rect x="148" y="196" width="80" height="96" rx="28" fill="url(#cyan-grad)" />
    <!-- Pupil highlight -->
    <circle cx="188" cy="226" r="14" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Right Eye -->
  <g filter="url(#glow)">
    <rect x="284" y="196" width="80" height="96" rx="28" fill="url(#cyan-grad)" />
    <!-- Pupil highlight -->
    <circle cx="324" cy="226" r="14" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Speaker Grille / Matrix Smile -->
  <circle cx="216" cy="380" r="8" fill="#38bdf8" />
  <circle cx="256" cy="380" r="8" fill="#38bdf8" />
  <circle cx="296" cy="380" r="8" fill="#38bdf8" />

  <!-- Antenna / Camera Beacon -->
  <line x1="256" y1="116" x2="256" y2="40" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="32" r="16" fill="#38bdf8" filter="url(#glow)" />
</svg>
